name: Build Delvin Choob APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: unzip -q delvin_choob_android_studio_project.zip -d extracted

      - name: Show project files
        run: find extracted -maxdepth 3 -type f

     - name: Build APK
        run: |
          cd "extracted/delvin_choob_android_studio_project (4)/delvin_android_project"
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: delvin-choob-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
